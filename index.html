<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MASTER DASHBOARD</title>
<style>
  :root{
    --black:#000000;
    --bg1:#0a0a0a;
    --bg2:#141414;
    --line:#2a2a2a;
    --grey:#8a8a8a;
    --grey-light:#c4c4c4;
    --white:#f5f5f5;
    --glow: rgba(255,255,255,0.35);
    --radius:14px;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    background:
      radial-gradient(ellipse at top left, #161616 0%, #000000 55%),
      radial-gradient(ellipse at bottom right, #101010 0%, #000000 60%);
    background-color:var(--black);
    color:var(--white);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  ::selection{background:#ffffff33;}

  /* ---------- scrollbar ---------- */
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#2c2c2c;border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:#3c3c3c;}

  /* ---------- topbar ---------- */
  header.topbar{
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:14px 28px;
    background:rgba(8,8,8,0.55);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border-bottom:1px solid var(--line);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:14px;
    flex-shrink:0;
  }

  .brand img{
    width:38px;
    height:38px;
    object-fit:cover;
    border-radius:8px;
    filter:grayscale(100%) contrast(1.15);
    border:1px solid #333;
  }

  .brand h1{
    font-size:15px;
    letter-spacing:3px;
    font-weight:700;
    text-transform:uppercase;
    color:var(--white);
    white-space:nowrap;
  }

  .brand h1 span{color:var(--grey);font-weight:500;}

  /* channels */
  .channels{
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }

  .channels .label{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--grey);
    font-weight:600;
  }

  .tabs{
    display:flex;
    gap:6px;
    background:#111;
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
  }

  .tab-btn{
    display:flex;
    align-items:center;
    gap:7px;
    border:none;
    background:transparent;
    color:var(--grey);
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    transition:all .25s ease;
    white-space:nowrap;
  }

  .tab-btn:hover{color:var(--white);}

  .tab-btn.active{
    background:var(--white);
    color:#0a0a0a;
    box-shadow:0 0 18px var(--glow);
  }

  /* actions */
  .actions{
    display:flex;
    align-items:center;
    gap:14px;
    flex:1;
    justify-content:flex-end;
    min-width:0;
  }

  .search-wrap{
    position:relative;
    max-width:260px;
    width:100%;
  }

  .search-wrap svg{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    width:15px;
    height:15px;
    stroke:var(--grey);
    pointer-events:none;
  }

  .search-wrap input{
    width:100%;
    background:#111;
    border:1px solid var(--line);
    color:var(--white);
    font-family:var(--sans);
    font-size:13px;
    padding:9px 12px 9px 34px;
    border-radius:999px;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }

  .search-wrap input::placeholder{color:#666;}

  .search-wrap input:focus{
    border-color:#555;
    box-shadow:0 0 14px rgba(255,255,255,0.12);
  }

  .discord-btn{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--white);
    color:#0a0a0a;
    font-weight:700;
    font-size:13px;
    padding:9px 16px;
    border-radius:999px;
    text-decoration:none;
    white-space:nowrap;
    transition:box-shadow .25s, transform .2s;
    border:1px solid #fff;
  }

  .discord-btn:hover{
    box-shadow:0 0 22px var(--glow);
    transform:translateY(-1px);
  }

  .discord-btn svg{width:16px;height:16px;fill:#0a0a0a;}

  /* ---------- main ---------- */
  main{
    max-width:1180px;
    margin:0 auto;
    padding:48px 28px 140px;
  }

  .section-heading{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:10px;
  }

  .section-heading h2{
    font-size:22px;
    font-weight:700;
    letter-spacing:0.5px;
  }

  .section-heading p{
    font-size:13px;
    color:var(--grey);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:18px;
  }

  /* card */
  .card{
    position:relative;
    display:block;
    background:linear-gradient(155deg, #131313 0%, #0b0b0b 100%);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    text-decoration:none;
    color:var(--white);
    overflow:hidden;
    transition:transform .28s ease, box-shadow .28s ease, border-color .28s ease;
    opacity:0;
    transform:translateY(14px);
    animation:cardIn .5s ease forwards;
  }

  @keyframes cardIn{
    to{opacity:1; transform:translateY(0);}
  }

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.08), transparent 60%);
    opacity:0;
    transition:opacity .3s ease;
    pointer-events:none;
  }

  .card:hover{
    transform:translateY(-4px);
    border-color:#4a4a4a;
    box-shadow:0 0 0 1px #3a3a3a, 0 12px 30px -10px rgba(0,0,0,0.8), 0 0 26px -4px var(--glow);
  }

  .card:hover::before{opacity:1;}

  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:18px;
    position:relative;
    z-index:1;
  }

  .card-title{
    font-size:17px;
    font-weight:700;
    letter-spacing:0.2px;
  }

  .card-url{
    font-size:12px;
    color:var(--grey);
    margin-top:4px;
    font-family:var(--mono);
    word-break:break-all;
  }

  .badge{
    flex-shrink:0;
    font-size:10px;
    font-weight:700;
    letter-spacing:1px;
    padding:4px 9px;
    border-radius:999px;
    border:1px solid;
    white-space:nowrap;
    margin-left:12px;
  }

  .badge.online{
    color:#d9d9d9;
    border-color:#4a4a4a;
    background:#1a1a1a;
  }

  .badge.online::before{
    content:"";
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:#eaeaea;
    margin-right:6px;
    box-shadow:0 0 6px #ffffffaa;
    vertical-align:middle;
  }

  .badge.novo{
    color:#0a0a0a;
    background:var(--white);
    border-color:#fff;
  }

  .card-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    z-index:1;
    padding-top:16px;
    border-top:1px dashed var(--line);
  }

  .latency{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--grey-light);
    font-family:var(--mono);
  }

  .latency svg{width:13px;height:13px;stroke:var(--grey-light);}

  .go-arrow{
    width:26px;height:26px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .25s, transform .25s, border-color .25s;
  }

  .go-arrow svg{width:12px;height:12px;stroke:var(--grey-light);transition:transform .25s;}

  .card:hover .go-arrow{
    background:var(--white);
    border-color:var(--white);
    transform:rotate(45deg);
  }
  .card:hover .go-arrow svg{stroke:#0a0a0a;}

  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:70px 20px;
    color:var(--grey);
  }

  .empty-state h3{
    font-size:16px;
    color:var(--white);
    margin-bottom:6px;
    font-weight:600;
  }

  .empty-state p{font-size:13px;}

  /* ---------- audio widget ---------- */
  .audio-widget{
    position:fixed;
    bottom:22px;
    right:22px;
    z-index:200;
    display:flex;
    align-items:center;
    gap:12px;
    background:rgba(15,15,15,0.7);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line);
    border-radius:999px;
    padding:10px 16px 10px 10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
    transition:box-shadow .3s ease, border-color .3s ease;
  }

  .audio-widget:hover{
    border-color:#4a4a4a;
    box-shadow:0 10px 30px rgba(0,0,0,0.6), 0 0 22px -2px var(--glow);
  }

  .play-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--white);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform .2s ease;
  }

  .play-btn:active{transform:scale(0.92);}

  .play-btn svg{width:15px;height:15px;fill:#0a0a0a;}

  .eq{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:18px;
  }

  .eq span{
    display:block;
    width:3px;
    background:var(--white);
    border-radius:2px;
    height:4px;
    opacity:0.35;
    transition:opacity .3s;
  }

  .eq.playing span{
    opacity:1;
    animation:eqBounce 0.9s ease-in-out infinite;
  }

  .eq.playing span:nth-child(1){animation-delay:0s;}
  .eq.playing span:nth-child(2){animation-delay:0.2s;}
  .eq.playing span:nth-child(3){animation-delay:0.4s;}

  @keyframes eqBounce{
    0%,100%{height:4px;}
    50%{height:17px;}
  }

  .audio-info{
    display:flex;
    flex-direction:column;
    line-height:1.3;
  }

  .audio-status{
    font-size:12px;
    font-weight:600;
    color:var(--white);
  }

  .audio-sub{
    font-size:10.5px;
    color:var(--grey);
    letter-spacing:0.3px;
  }

  /* ---------- responsive ---------- */
  @media (max-width: 860px){
    header.topbar{
      flex-wrap:wrap;
      row-gap:14px;
      padding:14px 18px;
    }
    .channels{order:3; width:100%; justify-content:flex-start;}
    .actions{order:2; flex:none; margin-left:auto;}
    .brand h1{font-size:13px; letter-spacing:2px;}
  }

  @media (max-width: 560px){
    .brand h1{display:none;}
    .actions{gap:10px;}
    .search-wrap{max-width:150px;}
    .discord-btn span.txt{display:none;}
    .discord-btn{padding:9px 12px;}
    main{padding:34px 16px 130px;}
    .audio-widget{right:14px; bottom:14px; padding:8px 14px 8px 8px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="logo.gif" alt="Master logo">
    <h1>MASTER <span>DASHBOARD</span></h1>
  </div>

  <div class="channels">
    <span class="label">Canais:</span>
    <div class="tabs">
      <button class="tab-btn active" data-channel="sites" type="button">🌐 Sites</button>
      <button class="tab-btn" data-channel="ferramentas" type="button">🛠️ Ferramentas</button>
    </div>
  </div>

  <div class="actions">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="searchInput" type="text" placeholder="Buscar por título ou URL...">
    </div>
    <a class="discord-btn" href="https://discord.gg/2Fqw3gWKXc" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
      <span class="txt">Discord</span>
    </a>
  </div>
</header>

<main>
  <div class="section-heading">
    <h2 id="sectionTitle">Sites</h2>
    <p id="sectionCount">2 itens</p>
  </div>

  <div class="grid" id="grid"></div>
</main>

<div class="audio-widget" id="audioWidget">
  <button class="play-btn" id="playBtn" type="button" aria-label="Reproduzir/Pausar áudio">
    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
    <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"></path></svg>
  </button>
  <div class="eq" id="eq"><span></span><span></span><span></span></div>
  <div class="audio-info">
    <span class="audio-status" id="audioStatus">Clique para ouvir</span>
    <span class="audio-sub">background loop</span>
  </div>
  <audio id="bgAudio" src="audio.m4a" loop preload="auto"></audio>
</div>

<script>
  // ---------------- DATA (read-only, hard-coded) ----------------
  const DATA = {
    sites: [
      { title:"Splunk", url:"https://abre.ai/splunkxmaster", status:"ONLINE", latency:"18ms" },
      { title:"Última X", url:"https://abre.ai/ultimaxx", status:"ONLINE", latency:"12ms" },
    ],
    ferramentas: [
      { title:"hyperlink", url:"https://hyperlink-beta.vercel.app", status:"ONLINE", latency:"22ms" },
      { title:"Script Gerador", url:"https://master-site-two.vercel.app", status:"NOVO", latency:"15ms" },
    ]
  };

  const SECTION_LABELS = { sites:"Sites", ferramentas:"Ferramentas" };

  let currentChannel = "sites";
  let currentQuery = "";

  const grid = document.getElementById("grid");
  const sectionTitle = document.getElementById("sectionTitle");
  const sectionCount = document.getElementById("sectionCount");
  const searchInput = document.getElementById("searchInput");

  function cleanUrl(url){
    return url.replace(/^https?:\/\//,"");
  }

  function renderCard(item){
    const statusClass = item.status === "ONLINE" ? "online" : "novo";
    return `
      <a class="card" href="${item.url}" target="_blank" rel="noopener noreferrer">
        <div class="card-top">
          <div>
            <div class="card-title">${item.title}</div>
            <div class="card-url">${cleanUrl(item.url)}</div>
          </div>
          <span class="badge ${statusClass}">${item.status}</span>
        </div>
        <div class="card-bottom">
          <div class="latency">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"></path></svg>
            ${item.latency}
          </div>
          <div class="go-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
          </div>
        </div>
      </a>
    `;
  }

  function render(){
    const items = DATA[currentChannel].filter(item => {
      const q = currentQuery.trim().toLowerCase();
      if(!q) return true;
      return item.title.toLowerCase().includes(q) || item.url.toLowerCase().includes(q);
    });

    sectionTitle.textContent = SECTION_LABELS[currentChannel];
    sectionCount.textContent = `${items.length} ${items.length === 1 ? "item" : "itens"}`;

    if(items.length === 0){
      grid.innerHTML = `
        <div class="empty-state">
          <h3>Nenhum resultado encontrado</h3>
          <p>Tente ajustar sua busca ou trocar de canal.</p>
        </div>`;
      return;
    }

    grid.innerHTML = items.map(renderCard).join("");

    // stagger animation
    [...grid.querySelectorAll(".card")].forEach((card, i) => {
      card.style.animationDelay = `${i * 0.05}s`;

      card.addEventListener("mousemove", (e) => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty("--mx", `${e.clientX - rect.left}px`);
        card.style.setProperty("--my", `${e.clientY - rect.top}px`);
      });
    });
  }

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentChannel = btn.dataset.channel;
      render();
    });
  });

  searchInput.addEventListener("input", (e) => {
    currentQuery = e.target.value;
    render();
  });

  render();

  // ---------------- AUDIO WIDGET ----------------
  const audio = document.getElementById("bgAudio");
  const playBtn = document.getElementById("playBtn");
  const playIcon = document.getElementById("playIcon");
  const pauseIcon = document.getElementById("pauseIcon");
  const eq = document.getElementById("eq");
  const audioStatus = document.getElementById("audioStatus");

  let userInteracted = false;
  let wantsPlaying = false;

  function setPlayingUI(isPlaying){
    playIcon.style.display = isPlaying ? "none" : "block";
    pauseIcon.style.display = isPlaying ? "block" : "none";
    eq.classList.toggle("playing", isPlaying);
    audioStatus.textContent = isPlaying ? "Tocando áudio..." : "Pausado";
  }

  function tryPlay(){
    audio.play().then(() => {
      setPlayingUI(true);
    }).catch(() => {
      setPlayingUI(false);
      audioStatus.textContent = "Clique para ouvir";
    });
  }

  playBtn.addEventListener("click", () => {
    userInteracted = true;
    if(audio.paused){
      wantsPlaying = true;
      tryPlay();
    } else {
      audio.pause();
      wantsPlaying = false;
      setPlayingUI(false);
    }
  });

  // Attempt autoplay; if blocked, wait for first user click anywhere on the page
  window.addEventListener("load", () => {
    wantsPlaying = true;
    tryPlay();
  });

  function unlockOnFirstInteraction(){
    if(userInteracted) return;
    userInteracted = true;
    if(wantsPlaying && audio.paused){
      tryPlay();
    }
  }

  ["click","touchstart","keydown"].forEach(evt => {
    document.addEventListener(evt, unlockOnFirstInteraction, { once:true });
  });

  audio.addEventListener("pause", () => { if(wantsPlaying === false) setPlayingUI(false); });
  audio.addEventListener("play", () => setPlayingUI(true));
</script>

</body>
</html>
